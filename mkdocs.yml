site_name: Rental Platform
site_description: Gestão segura e rastreável para locadoras de ferramentas
site_url: https://viniciussilva97.github.io/rental-platform/
repo_url: https://github.com/ViniciusSilva97/rental-platform
repo_name: ViniciusSilva97/rental-platform

theme:
  name: material
  language: pt-BR
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro

nav:
  - Início: index.md
  - Manual de uso: manual.md
  - Operação e implantação: operations.md
  - Arquitetura: architecture.md
  - Referência do código: code-reference.md
  - Decisões: decisions.md
  - Fluxo de desenvolvimento: development-workflow.md
  - Contexto para IA: ai-context.md
  - Versões:
      - v0.3.0: versions/v0.3.0.md
      - v0.2.2: versions/v0.2.2.md
      - v0.2.1: versions/v0.2.1.md
      - v0.2.0: versions/v0.2.0.md
      - v0.1.0: versions/v0.1.0.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ViniciusSilva97

copyright: Rental Platform — documentação da versão 0.3.0
