[project]
name = "rental-platform"
version = "0.1.0"
description = "Plataforma web de gestão de aluguel de ferramentas."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2.8,<5.3",
    "gunicorn>=23.0,<24",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --disable-warnings --cov=apps --cov=common --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
